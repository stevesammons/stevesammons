  el('path',{d:smooth([[31.95,35.545],[31.90,35.56],[31.85,35.545],[31.80,35.56],[31.765,35.545]]),fill:'none',stroke:'#7fa7b0','stroke-width':'2.2'},svg);

  var labels=el('g',{},svg);
  function tx(t,lat,lon,cls,rot,anchor){var q=P(lat,lon),a={x:q[0],y:q[1],class:cls,'text-anchor':anchor||'middle'};if(rot)a.transform='rotate('+rot+' '+q[0]+' '+q[1]+')';var e=el('text',a,labels);e.textContent=t;return e;}
  tx('Mediterranean Sea',31.62,34.30,'chm-water',-52);
  tx('Salt Sea',31.42,35.49,'chm-water',-82);

  tx('Jordan',31.90,35.60,'chm-water',-80).style.fontSize='10px';
  var rl=el('g',{class:'chm-region'},labels);
  [['Hill Country of Judah',31.70,35.10,-62],['Shephelah',31.62,34.86,-64],['Judean Wilderness',31.42,35.29,-66],['Negev',31.13,34.98,0],['Wilderness of Zin',30.93,35.02,0],['Wilderness of Paran',30.70,34.98,0],['Coastal plain',31.52,34.62,-55]].forEach(function(r){var q=P(r[1],r[2]);var e=el('text',{x:q[0],y:q[1],class:'chm-rlabel','text-anchor':'middle',transform:r[3]?'rotate('+r[3]+' '+q[0]+' '+q[1]+')':''},rl);e.textContent=r[0];});

  // Scale bar and north arrow
  var sb=el('g',{transform:'translate(452 676)'},svg), ten=16.09*K/111.2;
  el('rect',{x:0,y:-6,width:ten,height:5,fill:'var(--ink)'},sb);el('rect',{x:ten,y:-6,width:ten,height:5,fill:'#fff',stroke:'var(--ink)','stroke-width':'1'},sb);
  [['0',0],['10',ten],['20 mi',ten*2]].forEach(function(t){var e=el('text',{x:t[1],y:13,'font-size':'13','text-anchor':'middle',fill:'var(--ink)'},sb);e.textContent=t[0];});
  var na=el('g',{transform:'translate(40 44)'},svg);
  el('path',{d:'M0 -18 L8 6 L0 1 L-8 6 Z',fill:'var(--ink)'},na);var nt=el('text',{x:0,y:20,'font-size':'12','font-weight':'700','text-anchor':'middle',fill:'var(--ink)'},na);nt.textContent='N';

  // Routes
  var rg=el('g',{},svg), routeEls={};
  Object.keys(ROUTES).forEach(function(k){routeEls[k]=el('path',{d:smooth(ROUTES[k].pts),class:'chm-route '+ROUTES[k].cls},rg);});
  var offT=tx('on to Rehob, toward Lebo Hamath ↑',31.925,35.215,'chm-rlabel',0,'end');offT.style.fill='var(--accent)';offT.style.opacity='0';offT.style.transition='opacity .4s';

  // Places
  var pg=el('g',{},svg), plEls={};
  Object.keys(PL).forEach(function(k){
    var p=PL[k],q=P(p.ll[0],p.ll[1]);
    var g=el('g',{class:'chm-pl'+(p.ref?' chm-ref':''),tabindex:'0',role:'button','aria-label':p.name+(p.sub?' ('+p.sub+')':'')+'. '+p.confT},pg);
    if(p.area) el('ellipse',{cx:q[0],cy:q[1],rx:20,ry:13,class:'chm-area'},g);
    el('circle',{cx:q[0],cy:q[1],r:17,class:'halo'},g);
    el('circle',{cx:q[0],cy:q[1],r:p.ref?5.5:(k==='hebron'?9:7),class:'dot',fill:p.ref?'var(--ref)':(p.area?'var(--accent2)':'var(--accent)')},g);
    var right={kadesh:1,beersheba:1,gilgal:0,jerusalem:0,hebron:1,eshcol:1,debir:0}[k];
    var dx=right?14:-14, anchor=right?'start':'end', dy={eshcol:-8,hebron:8,debir:14,gilgal:0,jerusalem:0}[k]||5;
    var l=el('text',{x:q[0]+dx,y:q[1]+dy,class:'lbl','text-anchor':anchor},g);l.textContent=p.name;
    if(p.sub){var s=el('text',{x:q[0]+dx,y:q[1]+dy+16,class:'sub','text-anchor':anchor},g);s.textContent=p.sub;}

    var t=el('title',{},g);t.textContent=p.name;

  });

  /* ---------- Panel ---------- */
  var tabs=root.querySelector('.chm-tabs'), cur=0, selKey=null;
  CH.forEach(function(c,i){var b=document.createElement('button');b.type='button';b.className='chm-tab';b.setAttribute('role','tab');b.id='chm-tab-'+c.id;b.innerHTML='<b>'+(i+1)+'</b>'+c.tab;b.addEventListener('click',function(){go(i);});tabs.appendChild(b);});
  tabs.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();go(cur+(e.key==='ArrowRight'?1:-1),true);}});
  root.querySelectorAll('[data-go]').forEach(function(b){b.addEventListener('click',function(){go(cur+(+b.dataset.go));});});
  root.querySelectorAll('[data-toggle]').forEach(function(b){b.addEventListener('click',function(){var on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);
    if(b.dataset.toggle==='modern'){['jerusalem','beersheba'].forEach(function(k){plEls[k].classList.toggle('chm-hidden',!on);});}
    else root.querySelectorAll('.chm-region').forEach(function(g){g.style.opacity=on?1:0;});});});

  function profile(key){
    var box=root.querySelector('.chm-prof'); if(!key){box.innerHTML='';return;}

    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+pr.label+'">';

    s+='<text x="'+(L-4)+'" y="'+(Y(3000)+3)+'" font-size="8" text-anchor="end" fill="#5d6a6d">3,000 ft</text><line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(3000)+'" y2="'+Y(3000)+'" stroke="#e3dccb"/>';
    s+='<path d="'+line+' L'+X(pr.max)+' '+(H-B)+' L'+X(0)+' '+(H-B)+' Z" fill="#d9c79a" opacity=".55"/><path d="'+line+'" fill="none" stroke="#8a5a14" stroke-width="2"/>';
    pr.pts.forEach(function(p){s+='<circle cx="'+X(p[1])+'" cy="'+Y(p[2])+'" r="3" fill="#c8322d"/><text x="'+X(p[1])+'" y="'+(H-B+12)+'" font-size="8.5" text-anchor="middle" fill="#1f2a2c">'+p[0]+'</text><text x="'+X(p[1])+'" y="'+(Y(p[2])-6)+'" font-size="8" text-anchor="middle" fill="#5d6a6d">'+p[2].toLocaleString()+'</text>';});
    s+='<text x="'+W/2+'" y="'+(H-2)+'" font-size="8.5" text-anchor="middle" fill="#5d6a6d">'+pr.label+'</text></svg>';
    box.innerHTML=s;
  }

  function select(k){

  }

    var tb=tabs.children[i]; if(focusTab) tb.focus(); if(tb.scrollIntoView&&tabs.scrollWidth>tabs.clientWidth) tabs.scrollLeft=tb.offsetLeft-tabs.clientWidth/2+tb.offsetWidth/2;

    profile(c.prof);
    Object.keys(plEls).forEach(function(k){var hot=c.hot.indexOf(k)>=0;plEls[k].classList.toggle('hot',hot);plEls[k].classList.toggle('dim',!hot&&!PL[k].ref);});
    Object.keys(routeEls).forEach(function(k){var e=routeEls[k],on=c.routes.indexOf(k)>=0;e.classList.remove('draw');
